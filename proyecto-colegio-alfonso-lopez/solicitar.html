<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Cita de Orientación</title>
    <link rel="stylesheet" href="recursos/estilos/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<a href="servicios.html#bienestar" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</a>

<div class="center-wrapper">

    <div class="center-card">

        <h1><i class="fa-solid fa-user-friends"></i> Solicitar Cita de Orientación</h1>
        <p class="form-desc">Diligencia este formulario para agendar una cita con Bienestar Estudiantil.</p>

        <form class="form-body">

            <div class="form-group">
                <label>Nombre Completo</label>
                <div class="input-icon">
                    <input type="text" placeholder="Escribe tu nombre">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Curso</label>
                <div class="input-icon">
                    <select>
                        <option selected disabled>Selecciona tu curso</option>
                        <option>6°</option><option>7°</option><option>8°</option>
                        <option>9°</option><option>10°</option><option>11°</option>
                    </select>
                    <i class="fa-solid fa-school"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Motivo</label>
                <div class="input-icon">
                    <select>
                        <option selected disabled>Selecciona el motivo</option>
                        <option>Apoyo emocional</option>
                        <option>Orientación académica</option>
                        <option>Conflictos escolares</option>
                        <option>Asesoría personal</option>
                    </select>
                    <i class="fa-solid fa-clipboard-question"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <div class="input-icon textarea-icon">
                    <textarea placeholder="Describe brevemente tu caso..."></textarea>
                    <i class="fa-solid fa-comment"></i>
                </div>
            </div>

            <button class="btn-submit-full">Enviar Solicitud <i class="fa-solid fa-paper-plane"></i></button>

        </form>

    </div>

</div>

</body>
</html>
