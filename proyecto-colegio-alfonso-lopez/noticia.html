<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Noticia | ITAL</title>

  <link rel="stylesheet" href="recursos/estilos/estilo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="recursos/scripts/noticias-data.js"></script>
</head>

<body class="noticia-bg">

<a href="noticias.html" class="btn-volver-fixed">
  <i class="fa-solid fa-arrow-left"></i> Volver
</a>

<div class="noticia-center-wrapper">
  <div class="noticia-content-box">

    <h1 id="titulo"></h1>
    <p class="fecha-area" id="subtitulo"></p>

    <img id="imagen" class="imagen-noticia" src="">
    <p id="contenido" class="noticia-text"></p>

  </div>
</div>

<script>
  const id = parseInt(new URLSearchParams(location.search).get("id"));
  const n = noticias.find(x => x.id === id);

  if (n) {
    document.getElementById("titulo").textContent = n.titulo;
    document.getElementById("subtitulo").textContent = `${n.fecha} | ${n.area}`;
    document.getElementById("imagen").src = n.imagen;
    document.getElementById("contenido").innerHTML = n.contenido;
  }
</script>

</body>
</html>
