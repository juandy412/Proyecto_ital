<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Portal Académico</title>
  <link rel="stylesheet" href="../recursos/estilos/estilo.css" />
  <style>
    body.login-page {
      background: linear-gradient(135deg, var(--primary) 0%, var(--green-dark) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }
    .auth-card {
      background: rgba(255,255,255,0.92);
      border-radius: 14px;
      padding: 38px 30px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.18);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(26px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .auth-card h2 {
      color: var(--green-dark);
      margin-bottom: 14px;
      text-align: center;
      font-size: 1.9rem;
    }
    .auth-card-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 26px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid rgba(0,0,0,0.12);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.25s;
      box-sizing: border-box;
      background: rgba(255,255,255,0.95);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.18);
    }
    .form-group input::placeholder {
      color: #999;
    }
    .form-error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      border-left: 4px solid #c62828;
    }
    .auth-card button {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: var(--black);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .auth-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(0,0,0,0.22);
    }
    .auth-card button:active {
      transform: translateY(0);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.9);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="auth-card">
      <h2>🔐 Acceso al Portal</h2>
      <p class="auth-card-subtitle">Instituto Técnico Alfonso López</p>
      
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">👤 Usuario</label>
          <input 
            id="username" 
            name="username" 
            type="text" 
            placeholder="Ingresa tu usuario"
            required 
          />
        </div>

        <div class="form-group">
          <label for="password">🔑 Contraseña</label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            placeholder="Ingresa tu contraseña"
            required 
          />
        </div>

        <div id="loginError" class="form-error" aria-live="polite"></div>

        <button type="submit">Iniciar Sesión</button>
      </form>

      <button class="back-btn" type="button" onclick="window.history.back()" title="Volver a la página anterior">
        <i class="fas fa-arrow-left"></i> Volver atrás
      </button>
    </div>
  </div>

  <script src="../recursos/scripts/login.js"></script>
</body>
</html>
